```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration - Liste de Noël</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#761c2a,#123d2b);
  color: white;
}

.container { max-width: 950px; margin: auto; }
h1, h2 { color: #ffe6a0; }

.panel {
  background: white;
  color: #222;
  border: 2px solid #f1d58b;
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 22px;
}

input, textarea {
  width: 100%;
  padding: 11px;
  margin: 7px 0 14px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

label { font-weight: bold; }

button {
  border: 0;
  border-radius: 6px;
  padding: 10px 14px;
  margin: 4px;
  cursor: pointer;
  font-size: 14px;
}

button:disabled { opacity: .5; cursor: not-allowed; }

.primary { background: #23603b; color: white; }
.danger { background: #a52a36; color: white; }
.secondary { background: #ddd; color: #222; }

.gift {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 15px;
  margin: 12px 0;
  color: #222;
}

.gift h3 { margin-top: 0; }

.gift-image {
  display: block;
  max-width: 180px;
  max-height: 150px;
  object-fit: contain;
  margin: 10px 0;
  border-radius: 6px;
}

.actions { display: flex; flex-wrap: wrap; gap: 5px; }

#app, #login { display: none; }

#message {
  padding: 10px;
  margin: 10px 0;
  color: #23603b;
  font-weight: bold;
  white-space: pre-wrap;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.checkbox input {
  width: auto;
  margin: 0;
}

.help {
  color: #666;
  font-size: 13px;
  margin-top: -8px;
  margin-bottom: 14px;
}

#imagePreview {
  display: none;
  max-width: 220px;
  max-height: 180px;
  object-fit: contain;
  margin: 5px 0 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">

<h1>🎄 Administration de ma liste de Noël</h1>
<div id="message"></div>

<section id="login" class="panel">
  <h2>Connexion administrateur</h2>

  <label>Adresse e-mail</label>
  <input id="email" type="email" autocomplete="username">

  <label>Mot de passe</label>
  <input id="password" type="password" autocomplete="current-password">

  <button class="primary" id="loginButton">Se connecter</button>
</section>

<section id="app">

  <div class="panel">
    <h2>🎁 Ajouter un cadeau</h2>

    <form id="giftForm">

      <label>Nom du cadeau *</label>
      <input id="title" required maxlength="200">

      <label>Description</label>
      <textarea id="description" rows="3"></textarea>

      <label>Prix</label>
      <input id="price" type="number" min="0" step="0.01">

      <label>Lien du produit</label>
      <input id="url" type="url">

      <label>Image du cadeau</label>
      <input id="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      <div class="help">Choisis une image sur ton ordinateur (JPG, PNG, WEBP ou GIF, 5 Mo maximum).</div>
      <img id="imagePreview" alt="Aperçu de l'image">

      <label class="checkbox">
        <input id="allow_multiple" type="checkbox">
        Autoriser plusieurs réservations
      </label>

      <button class="primary" id="addButton" type="submit">
        Ajouter le cadeau
      </button>

    </form>
  </div>

  <div class="panel">
    <h2>📋 Mes cadeaux</h2>
    <div id="giftList">Chargement...</div>
  </div>

  <button class="secondary" id="logoutButton">
    Se déconnecter
  </button>

</section>
</div>

<script>
const SUPABASE_URL =
"https://wvtjyusstahvtihmmrlq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Y-kzecPom_Qjcu5cQ9oppw_gIUcv8OV";

const ADMIN_ID =
"00276736-BEDE-499C-9504-9B1DE789311D";

const BUCKET = "gift-images";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById("login");
const app = document.getElementById("app");
const message = document.getElementById("message");
const giftList = document.getElementById("giftList");
const imageFile = document.getElementById("image_file");
const imagePreview = document.getElementById("imagePreview");
const addButton = document.getElementById("addButton");

let gifts = [];
let previewObjectUrl = null;

function notify(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#b00020" : "#23603b";
}

function slugify(text) {
  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function createGiftId(title) {
  const base = slugify(title) || "cadeau";
  let candidate = base;
  let suffix = 2;

  while (gifts.some(gift => gift.id === candidate)) {
    candidate = base + "-" + suffix;
    suffix++;
  }

  return candidate;
}

function validateImage(file) {
  if (!file) return true;

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];

  if (!allowedTypes.includes(file.type)) {
    notify("Format refusé. Utilise JPG, PNG, WEBP ou GIF.", true);
    return false;
  }

  if (file.size > 5 * 1024 * 1024) {
    notify("L'image dépasse 5 Mo. Choisis un fichier plus léger.", true);
    return false;
  }

  return true;
}

imageFile.addEventListener("change", () => {
  if (previewObjectUrl) {
    URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = null;
  }

  const file = imageFile.files[0];

  if (!file) {
    imagePreview.style.display = "none";
    imagePreview.removeAttribute("src");
    return;
  }

  if (!validateImage(file)) {
    imageFile.value = "";
    imagePreview.style.display = "none";
    return;
  }

  previewObjectUrl = URL.createObjectURL(file);
  imagePreview.src = previewObjectUrl;
  imagePreview.style.display = "block";
});

async function uploadImage(file, giftId) {
  if (!file) return null;

  if (!validateImage(file)) {
    throw new Error("Image invalide.");
  }

  const extension = file.name.split(".").pop().toLowerCase();
  const safeExtension = /^[a-z0-9]+$/.test(extension)
    ? extension
    : "jpg";

  const filePath =
    giftId + "/" + Date.now() + "-" +
    crypto.randomUUID() + "." + safeExtension;

  const { error } = await db.storage
    .from(BUCKET)
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) {
    throw new Error("Envoi de l'image impossible : " + error.message);
  }

  const { data } = db.storage
    .from(BUCKET)
    .getPublicUrl(filePath);

  return data.publicUrl;
}

async function checkUser() {
  const { data: { user }, error } = await db.auth.getUser();

  if (error || !user ||
      user.id.toLowerCase() !== ADMIN_ID.toLowerCase()) {
    app.style.display = "none";
    loginSection.style.display = "block";

    if (user) {
      notify("Ce compte n'est pas autorisé à administrer les cadeaux.", true);
    }

    return false;
  }

  loginSection.style.display = "none";
  app.style.display = "block";

  await loadGifts();
  return true;
}

async function checkAdmin() {
  const { data: { user }, error } = await db.auth.getUser();

  if (error || !user ||
      user.id.toLowerCase() !== ADMIN_ID.toLowerCase()) {
    notify("Accès administrateur refusé.", true);
    return false;
  }

  return true;
}

document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    notify("Merci de remplir les deux champs.", true);
    return;
  }

  notify("Connexion en cours...");

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    notify("Erreur de connexion : " + error.message, true);
    return;
  }

  await checkUser();
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  app.style.display = "none";
  loginSection.style.display = "block";
  notify("Déconnexion effectuée.");
});

async function loadGifts() {
  giftList.textContent = "Chargement des cadeaux...";

  const { data, error } = await db
    .from("gifts")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: true });

  if (error) {
    notify("Impossible de charger les cadeaux : " + error.message, true);
    giftList.textContent = "";
    return;
  }

  gifts = data || [];
  renderGifts();
}

function renderGifts() {
  giftList.replaceChildren();

  if (gifts.length === 0) {
    giftList.textContent = "Aucun cadeau enregistré dans Supabase.";
    return;
  }

  gifts.forEach((gift, index) => {
    const card = document.createElement("div");
    card.className = "gift";

    const title = document.createElement("h3");
    title.textContent = "🎁 " + gift.title;

    const details = document.createElement("p");
    details.textContent =
      "Prix : " + (gift.price ?? "Non renseigné") +
      " | Ordre : " + gift.sort_order +
      " | Réservations multiples : " +
      (gift.allow_multiple ? "Oui" : "Non");

    card.append(title, details);

    if (gift.image_url) {
      const img = document.createElement("img");
      img.className = "gift-image";
      img.src = gift.image_url;
      img.alt = gift.title;
      img.onerror = () => {
        img.alt = "Image indisponible";
      };
      card.appendChild(img);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const up = document.createElement("button");
    up.className = "secondary";
    up.textContent = "⬆️";
    up.disabled = index === 0;
    up.title = "Monter";
    up.addEventListener("click", () => moveGift(index, -1));

    const down = document.createElement("button");
    down.className = "secondary";
    down.textContent = "⬇️";
    down.disabled = index === gifts.length - 1;
    down.title = "Descendre";
    down.addEventListener("click", () => moveGift(index, 1));

    const edit = document.createElement("button");
    edit.className = "primary";
    edit.textContent = "Modifier";
    edit.addEventListener("click", () => editGift(gift));

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "Supprimer";
    remove.addEventListener("click", () => deleteGift(gift));

    actions.append(up, down, edit, remove);
    card.appendChild(actions);
    giftList.appendChild(card);
  });
}

document.getElementById("giftForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const title = document.getElementById("title").value.trim();
  const file = imageFile.files[0];

  if (!title) {
    notify("Le nom du cadeau est obligatoire.", true);
    return;
  }

  if (!validateImage(file)) return;
  if (!await checkAdmin()) return;

  addButton.disabled = true;
  addButton.textContent = "Enregistrement...";

  try {
    const maxOrder = gifts.reduce(
      (max, gift) => Math.max(max, Number(gift.sort_order) || 0),
      0
    );

    const id = createGiftId(title);

    let imageUrl = null;

    if (file) {
      notify("Envoi de l'image en cours...");
      imageUrl = await uploadImage(file, id);
    }

    const gift = {
      id,
      title,
      description: document.getElementById("description").value.trim(),
      price: document.getElementById("price").value || null,
      url: document.getElementById("url").value.trim() || null,
      image_url: imageUrl,
      allow_multiple: document.getElementById("allow_multiple").checked,
      sort_order: maxOrder + 1
    };

    const { error } = await db.from("gifts").insert(gift);

    if (error) {
      throw new Error("Erreur lors de l'ajout : " + error.message);
    }

    document.getElementById("giftForm").reset();
    imagePreview.style.display = "none";

    if (previewObjectUrl) {
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = null;
    }

    notify("Cadeau ajouté !");
    await loadGifts();

  } catch (error) {
    notify(error.message, true);
  } finally {
    addButton.disabled = false;
    addButton.textContent = "Ajouter le cadeau";
  }
});

function chooseImageFile() {
  return new Promise(resolve => {
    const picker = document.createElement("input");
    picker.type = "file";
    picker.accept = "image/jpeg,image/png,image/webp,image/gif";

    picker.addEventListener("change", () => {
      resolve(picker.files[0] || null);
    });

    picker.click();
  });
}

async function editGift(gift) {
  if (!await checkAdmin()) return;

  const title = prompt("Nom du cadeau :", gift.title);
  if (title === null) return;

  if (!title.trim()) {
    notify("Le nom ne peut pas être vide.", true);
    return;
  }

  const description = prompt("Description :", gift.description || "");
  if (description === null) return;

  const price = prompt("Prix :", gift.price ?? "");
  if (price === null) return;

  const url = prompt("Lien du produit :", gift.url || "");
  if (url === null) return;

  let newImageFile = null;

  if (confirm("Veux-tu choisir une nouvelle image depuis ton ordinateur ?")) {
    newImageFile = await chooseImageFile();

    if (newImageFile && !validateImage(newImageFile)) return;
  }

  try {
    let imageUrl = gift.image_url || null;

    if (newImageFile) {
      notify("Envoi de la nouvelle image...");
      imageUrl = await uploadImage(newImageFile, gift.id);
    }

    const { error } = await db
      .from("gifts")
      .update({
        title: title.trim(),
        description: description.trim(),
        price: price.trim() || null,
        url: url.trim() || null,
        image_url: imageUrl
      })
      .eq("id", gift.id);

    if (error) {
      throw new Error(error.message);
    }

    notify("Cadeau modifié !");
    await loadGifts();

  } catch (error) {
    notify("Erreur de modification : " + error.message, true);
  }
}

async function deleteGift(gift) {
  if (!await checkAdmin()) return;

  if (!confirm("Supprimer définitivement « " + gift.title + " » ?")) {
    return;
  }

  const { error } = await db
    .from("gifts")
    .delete()
    .eq("id", gift.id);

  if (error) {
    notify("Erreur de suppression : " + error.message, true);
    return;
  }

  notify("Cadeau supprimé.");
  await loadGifts();
}

async function moveGift(index, direction) {
  if (!await checkAdmin()) return;

  const otherIndex = index + direction;

  if (otherIndex < 0 || otherIndex >= gifts.length) return;

  const current = gifts[index];
  const other = gifts[otherIndex];

  const firstOrder = current.sort_order;
  const secondOrder = other.sort_order;

  const { error: error1 } = await db
    .from("gifts")
    .update({ sort_order: secondOrder })
    .eq("id", current.id);

  if (error1) {
    notify("Erreur de déplacement : " + error1.message, true);
    await loadGifts();
    return;
  }

  const { error: error2 } = await db
    .from("gifts")
    .update({ sort_order: firstOrder })
    .eq("id", other.id);

  if (error2) {
    notify("Erreur de déplacement : " + error2.message, true);
    await loadGifts();
    return;
  }

  await loadGifts();
  notify("Ordre modifié !");
}

db.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") {
    app.style.display = "none";
    loginSection.style.display = "block";
  }
});

checkUser();
</script>
</body>
</html>
```
